name: dns-server

services:
    server:
        hostname: primary.high-dns.mafazaa.com
        networks:
            - dns-network
        build: .
        ports:
            - 53:53/tcp
            - 53:53/udp
        environment:
            REDIS_HOST: redis
            REDIS_PORT: 6379
            UPSTREAM: high-dns.mafazaa.com
            SERVER_HOSTNAME: localhost
            LEVEL: high
        depends_on:
            - redis
        restart: on-failure:5
    redis:
        networks:
            - dns-network
        image: redis:latest
        pull_policy: missing
        ports:
            - 6379:6379
        restart: on-failure:5
        volumes:
            - ./db:/data
    adguard_doh:
        image: adguard/dnsproxy:v0.75.4
        networks:
            - dns-network
        depends_on:
            - redis
            - server
        volumes:
            - ./dnsproxy/config.yaml:/opt/dnsproxy/config.yaml
            - ./dnsproxy/fullchain.pem:/etc/letsencrypt/live/high-dns.mafazaa.com/fullchain.pem
            - ./dnsproxy/privkey.pem:/etc/letsencrypt/live/high-dns.mafazaa.com/privkey.pem
        ports:
            - 443:443
            - 853:853
networks:
    dns-network:
